<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 운세</title>
  <style>
    :root {
      --bg: #0a0015;
      --card-back: #1a0a2e;
      --card-front-start: #1a0a2e;
      --card-front-end: #2d1b69;
      --gold: #c9a96e;
      --gold-light: #f0d080;
      --text: #e8d5ff;
      --text-dim: #a080c0;
      --glow: #9b59b6;
      --glow-bright: #d070ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* 별 배경 캔버스 */
    #starCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* 헤더 */
    .header {
      text-align: center;
    }

    .header .subtitle {
      font-size: 13px;
      letter-spacing: 6px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .header h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 300;
      letter-spacing: 8px;
      background: linear-gradient(135deg, var(--gold-light), var(--glow-bright), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(155, 89, 182, 0.5));
    }

    .header .desc {
      margin-top: 16px;
      font-size: 15px;
      color: var(--text-dim);
      line-height: 1.8;
      letter-spacing: 1px;
    }

    /* 구분선 */
    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      opacity: 0.4;
    }

    /* 운세 뽑기 버튼 */
    #drawBtn {
      padding: 16px 48px;
      font-size: 17px;
      letter-spacing: 4px;
      color: var(--bg);
      background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
      border: none;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(201, 169, 110, 0.4);
      animation: pulse 2.5s ease-in-out infinite;
    }

    #drawBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.4s;
    }

    #drawBtn:hover::before { transform: translateX(100%); }
    #drawBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(201, 169, 110, 0.7);
      animation: none;
    }
    #drawBtn:active { transform: translateY(0); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(201, 169, 110, 0.4); }
      50% { box-shadow: 0 0 40px rgba(201, 169, 110, 0.8), 0 0 60px rgba(201, 169, 110, 0.3); }
    }

    /* 카드 그리드 */
    #cardGrid {
      display: grid;
      grid-template-columns: repeat(4, 120px);
      gap: 18px;
      justify-content: center;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #cardGrid.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 카드 */
    .card-wrap {
      width: 120px;
      height: 180px;
      perspective: 800px;
      cursor: default;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      height: 100%;
      border-radius: 10px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(201, 169, 110, 0.2);
    }

    /* 카드 뒷면 */
    .card-back {
      background: var(--card-back);
      position: relative;
      overflow: hidden;
    }

    .card-back::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(155, 89, 182, 0.3);
      border-radius: 6px;
    }

    .card-back::after {
      content: '✦';
      font-size: 28px;
      color: rgba(155, 89, 182, 0.4);
    }

    .card-back .pattern {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 50% 50%, rgba(155, 89, 182, 0.08) 0%, transparent 70%);
    }

    /* 카드 앞면 */
    .card-front {
      background: linear-gradient(160deg, var(--card-front-start) 0%, var(--card-front-end) 100%);
      transform: rotateY(180deg);
      flex-direction: column;
      gap: 8px;
      padding: 12px 8px;
    }

    .card-symbol {
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 0 12px rgba(201, 169, 110, 0.8));
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--gold);
    }

    /* 선택된 카드 강조 */
    .card-wrap.chosen .card-inner {
      filter: drop-shadow(0 0 20px rgba(201, 169, 110, 0.9));
    }

    .card-wrap.chosen .card-front {
      border-color: var(--gold);
    }

    /* 카드 대기 중 흔들림 */
    .card-wrap.idle {
      animation: cardFloat var(--float-dur, 3s) ease-in-out infinite;
      animation-delay: var(--float-delay, 0s);
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* 운세 결과 패널 */
    #result {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(135deg, rgba(26,10,46,0.9), rgba(45,27,105,0.7));
      border: 1px solid rgba(201, 169, 110, 0.35);
      border-radius: 12px;
      padding: 36px 40px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 0.4s, transform 0.6s ease 0.4s;
      box-shadow: 0 0 40px rgba(155, 89, 182, 0.2), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    #result.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #result .result-label {
      font-size: 11px;
      letter-spacing: 5px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    #result .result-symbol {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(201, 169, 110, 1));
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(201, 169, 110, 0.8)); }
      50% { filter: drop-shadow(0 0 32px rgba(240, 208, 128, 1)); }
    }

    #result .result-card-name {
      font-size: 22px;
      letter-spacing: 6px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    #result .result-card-sub {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    #result .result-message {
      font-size: 16px;
      line-height: 2;
      color: var(--text);
      letter-spacing: 1px;
      padding: 0 10px;
    }

    #result .result-divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 20px auto;
      opacity: 0.5;
    }

    /* 다시 뽑기 버튼 */
    #resetBtn {
      margin-top: 8px;
      padding: 10px 32px;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid rgba(155, 89, 182, 0.4);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }

    #resetBtn:hover {
      color: var(--text);
      border-color: var(--glow);
      box-shadow: 0 0 20px rgba(155, 89, 182, 0.3);
    }

    /* 스파클 파티클 */
    .sparkle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: sparkleAnim 0.8s ease-out forwards;
      z-index: 999;
    }

    @keyframes sparkleAnim {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    /* 반응형 */
    @media (max-width: 560px) {
      #cardGrid {
        grid-template-columns: repeat(4, 80px);
        gap: 10px;
      }
      .card-wrap { width: 80px; height: 120px; }
      .card-symbol { font-size: 28px; }
      .card-name { font-size: 11px; }
      #result { padding: 28px 24px; }
      #result .result-symbol { font-size: 44px; }
      #result .result-card-name { font-size: 18px; }
      #result .result-message { font-size: 14px; }
    }

    @media (max-width: 400px) {
      #cardGrid {
        grid-template-columns: repeat(2, 100px);
        gap: 12px;
      }
      .card-wrap { width: 100px; height: 150px; }
    }
  </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<div class="container">
  <div class="header">
    <p class="subtitle">✦ Mystic Fortune ✦</p>
    <h1>오늘의 운세</h1>
    <p class="desc">
      마음을 고요히 하고<br>
      운명의 카드를 선택하세요
    </p>
  </div>

  <div class="divider"></div>

  <button id="drawBtn">✦ 운세 뽑기 ✦</button>

  <div id="cardGrid"></div>
  <p id="hint" style="font-size:13px;letter-spacing:3px;color:var(--text-dim);opacity:0;transition:opacity 0.5s;">✦ 카드를 클릭하여 운세를 확인하세요 ✦</p>

  <div id="result">
    <p class="result-label">✦ 오늘 당신의 운세 ✦</p>
    <div class="result-symbol" id="resultSymbol"></div>
    <div class="result-card-name" id="resultName"></div>
    <div class="result-card-sub" id="resultSub"></div>
    <div class="result-divider"></div>
    <p class="result-message" id="resultMessage"></p>
    <div class="result-divider"></div>
    <button id="resetBtn">↺ 다시 뽑기</button>
  </div>
</div>

    { symbol: '⚡', name: '소드 기사',   sub: 'Knight of Swords',  message: '빠르고 결단력 있게 행동할 때입니다.\n목표를 향해 직진하세요.' },
    { symbol: '👁️', name: '소드 여왕',  sub: 'Queen of Swords',   message: '날카로운 판단력이 빛나는 날입니다.\n감정보다 이성으로 결정하세요.' },
    { symbol: '⚖️', name: '소드 왕',    sub: 'King of Swords',    message: '공정하고 명확한 판단이 신뢰를 만듭니다.\n원칙을 지키며 나아가세요.' },
    // ── 펜타클 (Pentacles) · 물질·현실·노력 ──────────────────
    { symbol: '🪙', name: '펜타클 에이스', sub: 'Ace of Pentacles',   message: '물질적 기회가 찾아옵니다.\n현실적인 계획으로 풍요를 만들어 가세요.' },
    { symbol: '🔄', name: '펜타클 2',      sub: 'Two of Pentacles',   message: '균형을 잘 유지하고 있습니다.\n유연하게 대처하면 잘 풀립니다.' },
    { symbol: '🤝', name: '펜타클 3',      sub: 'Three of Pentacles', message: '협력이 빛을 발합니다.\n함께 일하면 훨씬 큰 성과를 냅니다.' },
    { symbol: '💰', name: '펜타클 4',      sub: 'Four of Pentacles',  message: '안정을 추구하지만 너무 꽉 쥐지는 마세요.\n나눔이 더 큰 풍요를 가져옵니다.' },
    { symbol: '⛏️', name: '펜타클 5',     sub: 'Five of Pentacles',  message: '어려움 속에서도 도움의 손길이 있습니다.\n혼자 짊어지려 하지 마세요.' },
    { symbol: '🤲', name: '펜타클 6',      sub: 'Six of Pentacles',   message: '주고받음의 균형이 중요합니다.\n관대함이 좋은 인연을 불러옵니다.' },
    { symbol: '⏳', name: '펜타클 7',      sub: 'Seven of Pentacles', message: '인내심을 갖고 기다리세요.\n꾸준한 노력이 반드시 결실을 맺습니다.' },
    { symbol: '🔨', name: '펜타클 8',      sub: 'Eight of Pentacles', message: '기술과 실력을 갈고닦는 시간입니다.\n집중하여 정진하면 전문가가 됩니다.' },
    { symbol: '🌻', name: '펜타클 9',      sub: 'Nine of Pentacles',  message: '독립적인 성취가 빛납니다.\n스스로의 노력으로 이룬 것을 자랑스러워하세요.' },
    { symbol: '🏛️', name: '펜타클 10',    sub: 'Ten of Pentacles',   message: '오랜 노력이 안정과 풍요로 돌아옵니다.\n가족과 함께 번영을 누리세요.' },
    { symbol: '📚', name: '펜타클 시종',   sub: 'Page of Pentacles',  message: '배움의 기회가 찾아옵니다.\n새로운 기술이나 지식에 투자하세요.' },
    { symbol: '🐂', name: '펜타클 기사',   sub: 'Knight of Pentacles', message: '느리더라도 확실하게 나아가세요.\n성실함이 목표를 이루게 합니다.' },
    { symbol: '🌳', name: '펜타클 여왕',   sub: 'Queen of Pentacles', message: '풍요로운 환경을 만드는 능력이 있습니다.\n실용적인 지혜가 빛납니다.' },
    { symbol: '🏔️', name: '펜타클 왕',    sub: 'King of Pentacles',  message: '안정적인 성공이 가까워졌습니다.\n현실적인 판단으로 풍요를 이끄세요.' },
  ];

  // 별 배경
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      alpha: Math.random() * 0.7 + 0.2,
      speed: Math.random() * 0.3 + 0.05,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinkleDir: Math.random() > 0.5 ? 1 : -1,
    }));
  }

  function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.alpha += s.twinkleSpeed * s.twinkleDir;
      if (s.alpha > 0.9 || s.alpha < 0.1) s.twinkleDir *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232, 213, 255, ${s.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }

  resizeCanvas();
  initStars();
  requestAnimationFrame(drawStars);
  window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

  // 스파클 파티클
  function spawnSparkles(x, y, count = 18) {
    const colors = ['#c9a96e', '#f0d080', '#d070ff', '#e8d5ff', '#ffffff'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
      const dist = 40 + Math.random() * 80;
      el.style.cssText = `
        left: ${x}px; top: ${y}px;
        width: ${3 + Math.random() * 5}px;
        height: ${3 + Math.random() * 5}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        --tx: ${Math.cos(angle) * dist}px;
        --ty: ${Math.sin(angle) * dist}px;
        animation-duration: ${0.6 + Math.random() * 0.5}s;
        animation-delay: ${Math.random() * 0.2}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }
  }

  // 카드 그리드 생성 (앞면 데이터 없이 빈 슬롯)
  const grid = document.getElementById('cardGrid');
  const cardWraps = [];

  for (let i = 0; i < 8; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.style.setProperty('--float-dur', `${2.5 + Math.random()}s`);
    wrap.style.setProperty('--float-delay', `${(i * 0.2) % 1.5}s`);
    wrap.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <div class="pattern"></div>
        </div>
        <div class="card-face card-front">
          <div class="card-symbol"></div>
          <div class="card-name"></div>
        </div>
      </div>
    `;
    grid.appendChild(wrap);
    cardWraps.push(wrap);
  }

  // 결과 요소
  const resultEl = document.getElementById('result');
  const resultSymbol = document.getElementById('resultSymbol');
  const resultName = document.getElementById('resultName');
  const resultSub = document.getElementById('resultSub');
  const resultMessage = document.getElementById('resultMessage');
  const drawBtn = document.getElementById('drawBtn');
  const resetBtn = document.getElementById('resetBtn');
  const hint = document.getElementById('hint');

  let drawn = false;
  let clickable = false;
  let shuffledCards = [];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  drawBtn.addEventListener('click', () => {
    if (drawn) return;
    drawn = true;
    drawBtn.style.display = 'none';

    // 56장 중 8장 무작위 선택
    shuffledCards = shuffle(CARDS).slice(0, 8);
    cardWraps.forEach((wrap, i) => {
      wrap.querySelector('.card-symbol').textContent = shuffledCards[i].symbol;
      wrap.querySelector('.card-name').textContent = shuffledCards[i].name;
    });

    // 그리드 표시
    grid.classList.add('visible');

    // 카드 하나씩 등장
    cardWraps.forEach((wrap, i) => {
      setTimeout(() => wrap.classList.add('idle'), i * 80);
    });

    // 카드 클릭 가능 상태로 전환
    setTimeout(() => {
      clickable = true;
      cardWraps.forEach(wrap => { wrap.style.cursor = 'pointer'; });
      hint.style.opacity = '1';
    }, 900);
  });

  // 카드 클릭으로 선택
  grid.addEventListener('click', e => {
    if (!clickable) return;
    const wrap = e.target.closest('.card-wrap');
    if (!wrap) return;

    clickable = false;
    hint.style.opacity = '0';
    const idx = cardWraps.indexOf(wrap);
    const chosen = shuffledCards[idx];

    cardWraps.forEach(w => {
      w.classList.remove('idle');
      w.style.cursor = 'default';
      if (w !== wrap) {
        w.style.opacity = '0.3';
        w.style.transition = 'opacity 0.5s';
      }
    });

    wrap.classList.add('chosen');
    wrap.querySelector('.card-inner').classList.add('flipped');

    const rect = wrap.getBoundingClientRect();
    setTimeout(() => spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 22), 350);

    resultSymbol.textContent = chosen.symbol;
    resultName.textContent = chosen.name;
    resultSub.textContent = chosen.sub;
    resultMessage.innerHTML = chosen.message.replace(/\n/g, '<br>');

    setTimeout(() => resultEl.classList.add('visible'), 600);
  });

  resetBtn.addEventListener('click', () => {
    drawn = false;
    clickable = false;
    shuffledCards = [];
    hint.style.opacity = '0';

    resultEl.classList.remove('visible');

    cardWraps.forEach(wrap => {
      wrap.classList.remove('chosen', 'idle');
      wrap.style.opacity = '';
      wrap.style.transition = '';
      wrap.style.cursor = '';
      wrap.querySelector('.card-inner').classList.remove('flipped');
    });

    setTimeout(() => {
      grid.classList.remove('visible');
      drawBtn.style.display = '';
    }, 400);
  });
</script>
</body>
</html>
